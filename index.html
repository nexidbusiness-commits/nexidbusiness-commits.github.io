<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEX ID Business</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Arial, sans-serif;
      background: #f7f7f5;
      color: #151515;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 28px;
      border-radius: 20px;
      background: #151515;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(38px, 8vw, 58px);
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 22px;
    }

    .id {
      font-weight: 300;
    }

    .tagline {
      font-size: 20px;
      line-height: 1.5;
      color: #555;
      margin-bottom: 40px;
    }

    .line {
      width: 45px;
      height: 2px;
      background: #151515;
      margin: 0 auto 32px;
    }

    .description {
      max-width: 400px;
      margin: auto;
      font-size: 15px;
      line-height: 1.7;
      color: #777;
    }

    footer {
      margin-top: 70px;
      font-size: 11px;
      letter-spacing: 1px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">N</div>

    <div class="brand">NEX ID Business</div>

    <h1>
      NEX <span class="id">ID</span>
    </h1>

    <p class="tagline">
      Conecta tu identidad.<br>
      Un toque.
    </p>

    <div class="line"></div>

    <p class="description">
      Una nueva forma de compartir tu identidad,
      información de contacto y presencia digital.
    </p>

    <footer>
      NEX ID BUSINESS
    </footer>

  </main>

</body>
</html>
