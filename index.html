<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Datos para transferencia | Carlos Israel Torres López</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f4f4;color:#161616;min-height:100vh;display:grid;place-items:center;padding:22px}
  .card{width:min(100%,430px);background:white;border-radius:24px;padding:30px 24px;box-shadow:0 12px 38px rgba(0,0,0,.10)}
  .icon{width:58px;height:58px;border-radius:18px;background:#111;color:white;display:grid;place-items:center;font-size:28px;margin-bottom:22px}
  h1{font-size:23px;margin:0 0 8px}
  .sub{color:#6a6a6a;margin:0 0 28px}
  .label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#777;margin-bottom:7px}
  .value{font-size:17px;font-weight:650;margin-bottom:22px;overflow-wrap:anywhere}
  .clabe{font-size:20px;letter-spacing:.035em}
  button{width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700;background:#111;color:#fff;cursor:pointer}
  button:active{transform:scale(.99)}
  .notice{font-size:13px;line-height:1.45;color:#666;margin:20px 2px 0}
  .ok{height:22px;text-align:center;font-size:14px;font-weight:650;margin-top:12px}
  footer{text-align:center;font-size:11px;color:#999;margin-top:20px}
</style>
</head>
<body>
<main class="card">
  <div class="icon">↗</div>
  <h1>Datos para transferencia</h1>
  <p class="sub">Copia la CLABE para realizar tu pago.</p>

  <div class="label">Beneficiario</div>
  <div class="value">Carlos Israel Torres López</div>

  <div class="label">Institución</div>
  <div class="value">Mercado Pago</div>

  <div class="label">CLABE</div>
  <div class="value clabe" id="clabe">722969010625850785</div>

  <button id="copyBtn" onclick="copiarClabe()">Copiar CLABE</button>
  <div class="ok" id="status" aria-live="polite"></div>

  <p class="notice">Antes de transferir, verifica en tu aplicación bancaria que el nombre del beneficiario coincida.</p>
  <footer>Datos proporcionados por el beneficiario</footer>
</main>

<script>
async function copiarClabe(){
  const valor=document.getElementById("clabe").textContent.trim();
  const status=document.getElementById("status");
  const btn=document.getElementById("copyBtn");
  try{
    await navigator.clipboard.writeText(valor);
  }catch(e){
    const area=document.createElement("textarea");
    area.value=valor; document.body.appendChild(area); area.select();
    document.execCommand("copy"); area.remove();
  }
  status.textContent="✓ CLABE copiada";
  btn.textContent="Copiada";
  setTimeout(()=>{status.textContent="";btn.textContent="Copiar CLABE"},2200);
}
</script>
</body>
</html>
