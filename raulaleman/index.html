<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Raúl Alemán | Grupo Alemán</title>

  <meta
    name="description"
    content="Raúl Alemán - Director General de Grupo Alemán Consultoría Financiera"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #111111;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }

    .profile {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      width: 260px;
      max-width: 80%;
      height: auto;
      margin: 10px auto 25px;
      display: block;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 7px;
      color: #1717c9;
    }

    .position {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .company {
      font-size: 15px;
      color: #666666;
      margin-bottom: 28px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px 18px;
      margin: 12px 0;
      border-radius: 12px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      background: #ffffff;
      color: #1717c9;
      border: 1px solid #dddddd;
      box-shadow: 0 3px 10px rgba(0,0,0,.06);
      transition: transform .15s ease;
    }

    .button:active {
      transform: scale(.98);
    }

    .primary {
      background: #1717c9;
      color: #ffffff;
      border: none;
    }

    .accent {
      background: #ff9015;
      color: #ffffff;
      border: none;
    }

    .address {
      margin-top: 25px;
      font-size: 14px;
      line-height: 1.5;
      color: #666666;
    }

    .powered {
      margin-top: 35px;
      padding-top: 18px;
      border-top: 1px solid #e5e5e5;
      font-size: 12px;
      color: #999999;
    }

    .powered strong {
      color: #1717c9;
    }
  </style>
</head>

<body>

  <main class="profile">

    <!-- LOGO GRUPO ALEMÁN -->
    <img
      src="logo-grupo-aleman.jpeg"
      alt="Grupo Alemán"
      class="logo"
    >

    <!-- INFORMACIÓN -->
    <h1>Raúl Alemán</h1>

    <p class="position">
      Director General
    </p>

    <p class="company">
      Grupo Alemán Consultoría Financiera
    </p>


    <!-- WHATSAPP -->
    <a
      href="https://wa.me/524448594511"
      class="button primary"
      target="_blank"
      rel="noopener"
    >
      💬 WhatsApp
    </a>


    <!-- LLAMAR -->
    <a
      href="tel:+524448594511"
      class="button"
    >
      📞 Llamar
    </a>


    <!-- CORREO -->
    <a
      href="mailto:direccion@grupo-aleman.com"
      class="button"
    >
      ✉️ Correo electrónico
    </a>


    <!-- INSTAGRAM -->
    <a
      href="https://www.instagram.com/trecedelasuerte"
      class="button"
      target="_blank"
      rel="noopener"
    >
      📷 Instagram
    </a>


    <!-- PÁGINA WEB -->
    <a
      href="https://grupo-aleman.com/"
      class="button"
      target="_blank"
      rel="noopener"
    >
      🌐 Página web
    </a>


    <!-- CÓMO LLEGAR -->
    <a
      href="https://www.google.com/maps/search/?api=1&query=Av.+Cordillera+de+los+Himalaya+262,+San+Luis+Potosi,+78294"
      class="button accent"
      target="_blank"
      rel="noopener"
    >
      📍 Cómo llegar
    </a>


    <!-- DIRECCIÓN -->
    <p class="address">
      Av. Cordillera de los Himalaya 262<br>
      San Luis Potosí, S.L.P. 78294
    </p>


    <!-- FIRMA NEXID -->
    <p class="powered">
      Powered by <strong>NexID</strong>
    </p>

  </main>

</body>
</html>
